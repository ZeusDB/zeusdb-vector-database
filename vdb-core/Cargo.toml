[package]
name = "zeusdb-vector-database"
version = "0.6.0"
edition = "2021"
resolver = "2" # <-- Avoid compiling unnecessary features from dependencies.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "zeusdb_vector_database" # <-- This is the name of the compiled Python module
crate-type = ["cdylib"]

[dependencies]
# abi3-py310 builds against CPython's stable ABI, so one wheel per platform
# loads on every CPython from 3.10 up, including versions that do not exist
# yet. The feature lives here rather than in pyproject's [tool.maturin]
# features, so that cargo build, cargo clippy and cargo test all compile the
# same configuration the wheel ships. The floor matches requires-python.
#
# The cost is PyPy and the free-threaded builds. Neither is expressible in the
# stable ABI, and the abi3t feature that PEP 803 adds for free-threading is
# 3.15 only, so it buys nothing at a 3.10 floor.
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
hnsw_rs = "0.3.4"
numpy = "0.29.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
rand = "0.9.1"
# The distance kernels' vector type. See the "How they are compiled" section of
# src/distance.rs for what it buys and why the auto-vectoriser could not.
# Three crates, being wide, safe_arch and bytemuck, taking the lock from 154 to
# 157. It is a build-time abstraction over the target's own vector registers
# with no run time component, so it adds nothing to the wheel beyond the code
# it generates.
wide = "1"
bincode = "2.0.1"
chrono = { version = "0.4.41", features = ["serde"] } # <-- For timestamps
# anndists is not declared here. The distances live in src/distance.rs, and the
# `Distance` trait they implement arrives through the hnsw_rs prelude, which
# re-exports anndists wholesale. Declaring it again bought nothing and made the
# dependency graph read as though vdb-core called it directly.

# Modern structured logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "time", "ansi", "registry"] }
# Terminal detection is `std::io::IsTerminal`, stable since Rust 1.70. The
# `atty` crate this replaced was unmaintained and carried RUSTSEC-2021-0145.

[dev-dependencies]
tempfile = "3"

# Redirect hnsw_rs to the vendored copy carrying the reverse link layer fix.
# See vendor/hnsw_rs/ZEUSDB-PATCH.md. The path is relative to this manifest.
[patch.crates-io]
hnsw_rs = { path = "../vendor/hnsw_rs" }

[profile.release]
lto = true          # Fat link-time optimization
codegen-units = 1   # Single compilation unit
opt-level = 3       # Full optimization
