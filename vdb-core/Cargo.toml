[package]
name = "zeusdb-vector-database"
version = "0.7.0"
edition = "2021"
# The same licence pyproject.toml declares, LICENSE holds and NOTICE restates.
# The crate is not published to crates.io, so nothing read this field until
# cargo-deny did, and it reported the crate that owns the tree as the one
# unlicensed thing in it. The wheel's metadata is unaffected, because maturin
# takes it from pyproject.toml.
license = "Apache-2.0"
resolver = "2" # <-- Avoid compiling unnecessary features from dependencies.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "zeusdb_vector_database" # <-- This is the name of the compiled Python module
crate-type = ["cdylib"]

# On by default, so every ordinary cargo command and the wheel build compile
# the same thing, and off for `cargo test` alone.
#
# `pyo3/extension-module` tells PyO3 that the output is a module a Python
# interpreter will load, so on Unix its build script deliberately emits no
# `-lpython`: the interpreter already holds those symbols and a shared object
# is allowed to leave them undefined. **An executable is not.** `cargo test`
# builds the lib target as a test executable, so with the feature on that
# executable links with every libpython symbol it references unresolved, and
# on Linux the link fails.
#
# It did not fail while no unit test reached PyO3. `--gc-sections` discarded
# every section that referenced libpython and the executable linked with none
# of it live. `columns::tests::the_declaration_is_validated` is the first test
# to construct a `PyErr`, which makes PyO3's exception and reference-count
# paths live, and the latent breakage became a failure. Removing that one test
# takes the undefined symbol count from eight back to zero, measured.
#
# Windows was never affected, because there every symbol must resolve at link
# time and PyO3 emits the import library whatever this feature says. That is
# why `cargo test` passed locally and failed in CI.
#
# **On Linux, run the tests as `cargo test --no-default-features`**, which is
# what the CI gate does. Turning the feature off makes PyO3 emit `-lpython3.x`,
# so the link needs a libpython the linker can resolve, which on Debian and
# Ubuntu means the python3-dev package rather than the interpreter alone.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# abi3-py310 builds against CPython's stable ABI, so one wheel per platform
# loads on every CPython from 3.10 up, including versions that do not exist
# yet. The feature lives here rather than in pyproject's [tool.maturin]
# features, so that cargo build, cargo clippy and cargo test all compile the
# same configuration the wheel ships. The floor matches requires-python.
#
# The cost is PyPy and the free-threaded builds. Neither is expressible in the
# stable ABI, and the abi3t feature that PEP 803 adds for free-threading is
# 3.15 only, so it buys nothing at a 3.10 floor.
#
# `extension-module` is no longer here. It is this crate's own feature above,
# on by default, so `cargo build`, `cargo clippy` and the wheel are unchanged
# and only `cargo test --no-default-features` differs.
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
numpy = "0.29.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
rand = "0.9.1"
# The generator itself, named rather than taken from `rand::rngs::StdRng`,
# which `rand` documents as non-portable and free to change algorithm in any
# release. Every seeded draw in the crate runs on it, being the level stream a
# graph is built from and both of the product quantizer's. See src/rng.rs.
#
# No crate. `rand`'s default features already pull `rand_chacha` in to build
# `StdRng` at all, so this names a dependency that was there rather than adding
# one, and the lock is unchanged at 118.
rand_chacha = "0.9"
# The distance kernels' vector type. See the "How they are compiled" section of
# src/distance.rs for what it buys and why the auto-vectoriser could not.
# Three crates, being wide, safe_arch and bytemuck, taking the lock from 154 to
# 157. It is a build-time abstraction over the target's own vector registers
# with no run time component, so it adds nothing to the wheel beyond the code
# it generates.
wide = "1"
bincode = "2.0.1"
chrono = { version = "0.4.41", features = ["serde"] } # <-- For timestamps
# Modern structured logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "time", "ansi", "registry"] }
# Terminal detection is `std::io::IsTerminal`, stable since Rust 1.70. The
# `atty` crate this replaced was unmaintained and carried RUSTSEC-2021-0145.

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true          # Fat link-time optimization
codegen-units = 1   # Single compilation unit
opt-level = 3       # Full optimization

# An optimised build that keeps `debug_assertions` on.
#
# The lock rank registry in src/hnsw_index/locks.rs is gated on
# `cfg(debug_assertions)` and on nothing else, so it is live in any profile
# that leaves them on. It had never run against tests/test_quantization.py or
# tests/test_metadata_columns.py, which is 282 of the suite, because the only
# build with the assertions on was the unoptimised one and the k-means and
# insertion paths those two files exercise are far slower without
# optimisation. The pair takes 131.8 s on a release build and the debug build
# was measured at more than forty minutes.
#
# This profile is the release profile with the assertions turned back on, so
# the registry runs at release speed and the gap closes with no scheduled job
# and no faster machine. Build it with
#
#   maturin develop --profile checked
#
# and run the suite as usual. Turn `lto` off here rather than inheriting it if
# the build time matters more than the run time; it is on so that the timing
# is comparable with the release build the figures above were taken on.
[profile.checked]
inherits = "release"
debug-assertions = true
