# cargo-deny configuration for the Rust dependency tree the wheel ships.
#
# The wheel is one compiled object. A user who installs it cannot enumerate the
# crates inside it, run an advisory check against them or read their licences,
# so the check runs here.
#
# It lives beside Cargo.toml rather than at the repository root, because
# cargo-deny reads the manifest directory and every cargo step in this project
# already sets working-directory to vdb-core.
#
# dependency-scan.yml runs this config in two passes, one over advisories and
# one over licences, bans and sources.

[graph]
# The targets the wheels are built for, from the publish-pypi.yml matrix plus
# the two the sdist reaches. Without this, cargo-deny walks every target's
# dependencies, which pulls in crates no wheel links.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# The RustSec database, checked against Cargo.lock.
version = 2
# A yanked release is a finding. A yanked version stays downloadable and
# --locked still resolves it.
yanked = "deny"

# Deliberately empty. An entry here removes the finding from the SARIF report
# altogether rather than downgrading it, so an entry must state why it is
# ignored and what would let it be removed.
ignore = []

[licenses]
version = 2
# Every licence the tree carries, and nothing else. A dependency arriving under
# a licence not listed here fails the run. The package is published under
# Apache-2.0 and ships NOTICE and ATTRIBUTION.md, so a copyleft crate entering
# the tree has to be a decision rather than a lockfile update nobody read.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# A crate offering several licences is satisfied by any allowed one, and this
# is the threshold at which cargo-deny stops asking.
confidence-threshold = 0.8

[bans]
# A second copy of a crate is a lockfile that resolved two incompatible semver
# ranges. It is a warning rather than an error because the resolution is
# usually not this project's to make.
multiple-versions = "warn"
wildcards = "deny"
# The build must not silently gain a crate from a git URL or a local path.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
