# Dependabot. Three ecosystems, all weekly on the same morning.
#
# github-actions raises the pinned commit SHA and the version comment beside it
# for every action under .github/workflows, grouped into one pull request.
#
# cargo watches the workspace at the root, being Cargo.toml, Cargo.lock and
# every member manifest under bindings/ and crates/.
#
# uv watches pyproject.toml and uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # bincode 3.0.0 carries no code, only a compile error. See deny.toml.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
