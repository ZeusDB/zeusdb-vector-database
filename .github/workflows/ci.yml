# Lints and tests every push and pull request on main and development.
#
# Linux only and cached, so the gate stays fast. The cross-platform build is
# covered by the wheel matrix in publish-pypi.yml.
#
# README.md and examples/ are deliberately NOT in paths-ignore, and must not be
# added to it. tests/test_readme_examples.py executes every fenced python block
# in README.md and compares the captured stdout against the output the document
# claims, and tests/test_examples.py runs every file under examples/ the same
# way. A commit touching only README.md therefore can and does break this gate,
# which is the whole reason both modules exist. The ignore list holds the files
# no test reads.
#
# A change matching every entry in the list runs nothing. A change touching one
# ignored file and one other file runs everything, because paths-ignore skips a
# run only when every changed path matches.
#
# The Cargo manifest lives in vdb-core, so every cargo step sets
# working-directory rather than running from the repository root.
#
# Cargo steps pass --locked, which fails the run when vdb-core/Cargo.lock is
# out of date instead of silently updating it. Keep the flag on every cargo
# step that accepts it.
name: CI

on:
  push:
    branches: [main, development]
    # Spelled out twice rather than shared through a YAML anchor, because the
    # workflow parser does not resolve aliases. Keep the two lists identical.
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'ATTRIBUTION.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main, development]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'ATTRIBUTION.md'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from rust-toolchain.toml and from nowhere else.
      #
      # This was dtolnay/rust-toolchain@stable, which installs whatever stable
      # resolves to on the day and sets it as the default. rust-toolchain.toml
      # then overrode it for every cargo invocation inside the checkout, so the
      # action's channel decided nothing and its components list applied to a
      # toolchain the gate never ran. Which of the two won was never
      # established, and the two agreed only by coincidence.
      #
      # `rustup toolchain install` with no argument reads the channel and the
      # components out of the file, so the version installed is the version
      # that runs. Raising the pin is now the whole of a toolchain bump.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vdb-core
          # Shared with the test job, which compiles the same dependencies.
          shared-key: vdb-core
          # Save the cache on a failed run too, so a red gate still warms it.
          cache-on-failure: true
      - name: Check Rust formatting
        working-directory: vdb-core
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: vdb-core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: lint
    # Runs whether lint passed or failed, and does not run when the run is
    # cancelled. needs alone would skip this job when lint fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # From rust-toolchain.toml, as in the lint job. See the note there.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vdb-core
          shared-key: vdb-core
          cache-on-failure: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the extension and install the project
        # uv sync installs the project through the maturin backend, which is
        # how the extension is built for development.
        run: uv sync --locked --extra dev
      - name: Run the Python test suite
        # Scoped to tests, because seven scripts under benchmarks end in
        # _test.py and start with a digit, which pytest cannot import.
        run: uv run --no-sync pytest tests
      # The Rust tests link an executable, and an executable has to resolve
      # every libpython symbol it references. `cargo test` below turns
      # `extension-module` off so that PyO3 emits the `-lpython` line, and that
      # line needs `libpython3.x.so`, which lives in python3-dev. The runner
      # image ships the interpreter and `libpython3.12.so.1.0` but not the
      # symlink a linker resolves `-l` against, so this is not a no-op.
      #
      # Nothing else in the job needs it. Building the extension does not,
      # because that is the case where PyO3 emits no link line at all.
      - name: Install libpython so the Rust tests can link
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev
      - name: Run the Rust test suite
        working-directory: vdb-core
        # --no-default-features turns off this crate's `extension-module`
        # feature, which is on for every other cargo command and for the wheel.
        # See the comment on it in vdb-core/Cargo.toml.
        run: cargo test --workspace --locked --no-default-features
