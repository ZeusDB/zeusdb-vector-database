        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$LIBPYTHON_DIR"
          cargo test --workspace --locked --no-default-features --no-fail-fast

  # test-python on arm64 macOS. Each step is test-python's with this runner's
  # uv and CPython.
  test-python-macos:
    runs-on: macos-15
