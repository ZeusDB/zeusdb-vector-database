# Lints and tests every push and pull request on main and development.
#
# Linux only and cached, so the gate stays fast. The cross-platform build is
# covered by the wheel matrix in publish-pypi.yml.
#
# The Cargo manifest lives in vdb-core, so every cargo step sets
# working-directory rather than running from the repository root.
#
# Cargo steps pass --locked, which fails the run when vdb-core/Cargo.lock is
# out of date instead of silently updating it. Keep the flag on every cargo
# step that accepts it.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vdb-core
          # Shared with the test job, which compiles the same dependencies.
          shared-key: vdb-core
          # Save the cache on a failed run too, so a red gate still warms it.
          cache-on-failure: true
      - name: Check Rust formatting
        working-directory: vdb-core
        # Temporary. Reports every gate failure on one run instead of stopping
        # at the first. Removed once the gate is green.
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: vdb-core
        # Temporary. Reports every gate failure on one run instead of stopping
        # at the first. Removed once the gate is green.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: lint
    # Runs whether lint passed or failed, and does not run when the run is
    # cancelled. needs alone would skip this job when lint fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vdb-core
          shared-key: vdb-core
          cache-on-failure: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the extension and install the project
        # uv sync installs the project through the maturin backend, which is
        # how the extension is built for development.
        run: uv sync --locked --extra dev
      - name: Run the Python test suite
        # Scoped to tests, because seven scripts under benchmarks end in
        # _test.py and start with a digit, which pytest cannot import.
        #
        # Temporary. Reports every gate failure on one run instead of stopping
        # at the first. Removed once the gate is green.
        continue-on-error: true
        run: uv run --no-sync pytest tests
      - name: Run the Rust test suite
        working-directory: vdb-core
        # Temporary. Reports every gate failure on one run instead of stopping
        # at the first. Removed once the gate is green.
        continue-on-error: true
        run: cargo test --workspace --locked
