  # test-python on x86-64 Linux with musl, on the newest CPython. musl changes
  # the C library, which is the same on both processors, and arm64 runs on
  # glibc in test-python-arm64, so one processor shows a fault of musl at the
  # commit that makes it. publish-pypi.yml's musllinux-suite runs both
  # processors and both interpreters on the wheels it publishes.
  # The Alpine image holds no Rust toolchain, so the extension is built as
  # publish-pypi.yml builds its x86-64 musllinux wheel, in the pinned musl
  # image through .github/scripts/build-linux-wheel.sh, once on the release
  # profile and once with the binding's test-support feature. The uv pinned
  # here is linked against glibc and cannot run in Alpine, so uv writes the
  # environment from uv.lock on the runner and the image's pip installs it in
  # the container from wheels alone, each held to its locked hash. The suite
  # runs as the runner's user and group, so every case runs.
  test-python-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See the lint job.
          fetch-depth: 0
      - name: Decide whether the change is documentation alone
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/documentation_only.py
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.scope.outputs.documentation-only != 'true'
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          # uv export needs an interpreter, and this is the newest build. The
          # suite runs on the Alpine image's CPython.
          python-version: ${{ env.NEWEST_CPYTHON_LINUX }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install maturin and patchelf
        if: steps.scope.outputs.documentation-only != 'true'
        # As publish-pypi.yml's musllinux job installs them, from the
        # hash-locked files, on the floor build. Each wheel holds a static
        # binary, which the build image runs from a read-only mount.
        run: |
          uv venv "$RUNNER_TEMP/maturin" --python "$FLOOR_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/maturin" --require-hashes --only-binary :all: --no-deps -r .github/requirements/maturin.txt -r .github/requirements/patchelf.txt
      - name: Build the musllinux wheel and the test-support wheel
        if: steps.scope.outputs.documentation-only != 'true'
        # As publish-pypi.yml's musllinux job builds its x86-64 wheel. The
        # second build passes test-support, the script's third argument, and
        # each build's wheel leaves dist before the next build writes there.
        run: |
          build() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/io" \
              --volume "$RUNNER_TEMP/maturin/bin/maturin:/usr/local/bin/maturin:ro" \
              --volume "$RUNNER_TEMP/maturin/bin/patchelf:/opt/patchelf/bin/patchelf:ro" \
              --workdir /io \
              --env CARGO_INCREMENTAL=0 \
              --env CARGO_TERM_COLOR=always \
              --env CARGO_BUILD_WARNINGS \
              "$MUSL_BUILD_IMAGE" \
              bash .github/scripts/build-linux-wheel.sh x86_64-unknown-linux-musl musllinux_1_2 "$@"
            sudo chown -R "$(id -u):$(id -g)" dist
          }
          build
          mv dist "$RUNNER_TEMP/release-wheel"
          build test-support
          mv dist "$RUNNER_TEMP/support-wheel"
      - name: Export the locked environment
        if: steps.scope.outputs.documentation-only != 'true'
        # See publish-pypi.yml's musllinux-suite.
        run: uv export --locked --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/suite.txt"
      - name: Run the Python test suite
        if: steps.scope.outputs.documentation-only != 'true'
        # On the release wheel in the Alpine image, as publish-pypi.yml's
        # musllinux-suite runs it.
        run: |
          docker run --rm --interactive \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --volume "$GITHUB_WORKSPACE:/io" \
            --volume "$RUNNER_TEMP/suite.txt:/suite.txt:ro" \
            --volume "$RUNNER_TEMP/release-wheel:/wheel:ro" \
            --workdir /io \
            "$NEWEST_IMAGE_ALPINE" sh -eu <<'SUITE'
          python -m venv /tmp/suite
          /tmp/suite/bin/python -m pip install --require-hashes --only-binary :all: --no-deps -r /suite.txt
          /tmp/suite/bin/python -m pip install --no-index --no-deps --find-links /wheel zeusdb-vector-database
          /tmp/suite/bin/python .github/scripts/installed_engine.py
          /tmp/suite/bin/python -m pytest tests --ignore=tests/test_interpreter.py --ignore=tests/test_overlap.py
          SUITE
      - name: Run the checks that need the test-support feature
        if: steps.scope.outputs.documentation-only != 'true'
        # The same container on the test-support wheel, with the two modules
        # alone.
        run: |
          docker run --rm --interactive \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --volume "$GITHUB_WORKSPACE:/io" \
            --volume "$RUNNER_TEMP/suite.txt:/suite.txt:ro" \
            --volume "$RUNNER_TEMP/support-wheel:/wheel:ro" \
            --workdir /io \
            "$NEWEST_IMAGE_ALPINE" sh -eu <<'SUITE'
          python -m venv /tmp/suite
          /tmp/suite/bin/python -m pip install --require-hashes --only-binary :all: --no-deps -r /suite.txt
          /tmp/suite/bin/python -m pip install --no-index --no-deps --find-links /wheel zeusdb-vector-database
          /tmp/suite/bin/python .github/scripts/installed_engine.py --test-support
          /tmp/suite/bin/python -m pytest tests/test_interpreter.py tests/test_overlap.py
          SUITE
