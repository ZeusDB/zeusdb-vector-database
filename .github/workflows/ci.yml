        # See test-python.
        run: uv run --no-sync maturin develop --release --locked --features test-support
      - name: Run the checks that need the test-support feature
        if: steps.scope.outputs.documentation-only != 'true'
        run: uv run --no-sync pytest tests/test_interpreter.py tests/test_overlap.py

  # test-python on x86-64 Windows, on the image the release builds the Windows
  # wheel on. Each step is test-python's with this runner's uv and CPython, and
  # every step runs in bash, so each step's command is the Linux jobs' command.
  # A CPython install on Windows names its interpreter python and carries no
  # python3, so the first step runs the image's python.
  test-python-windows:
