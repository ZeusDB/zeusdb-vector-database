          PYO3_PYTHON: ${{ steps.libpython.outputs.python }}
          LD_LIBRARY_PATH: ${{ steps.libpython.outputs.libdir }}
        # See test-rust.
        run: cargo test --workspace --locked --no-default-features --no-fail-fast

  # test-python on arm64 Linux. Each step is test-python's with this runner's
  # uv and CPython.
  test-python-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
