# Lints and tests every push and pull request on main and development.
#
# Linux only and cached, so the gate stays fast. The cross-platform build is
# covered by the wheel matrix in publish-pypi.yml.
#
# ON A PULL REQUEST THERE IS NO PATH FILTER, AND ONE MUST NOT BE ADDED.
#
# `lint`, `test-python` and `test-rust` are the three required status checks on
# main. A workflow that a path filter skips does not report its checks as
# skipped, it never reports them at all, and a required check that never reports
# leaves the pull request waiting for a status that cannot arrive. A pull request
# touching only CHANGELOG.md would therefore be unmergeable rather than cheap.
# The push trigger below keeps its ignore list, because no branch rule reads a
# push.
#
# README.md and examples/ are deliberately NOT in the push ignore list either,
# and must not be added to it. tests/test_readme_examples.py executes every
# fenced python block in README.md and compares the captured stdout against the
# output the document claims, and tests/test_examples.py runs every file under
# examples/ the same way. A commit touching only README.md therefore can and
# does break this gate, which is the whole reason both modules exist. The
# ignore list holds the files no test reads.
#
# A push matching every entry in the list runs nothing. A push touching one
# ignored file and one other file runs everything, because paths-ignore skips a
# run only when every changed path matches.
#
# The Cargo manifest lives in vdb-core, so every cargo step sets
# working-directory rather than running from the repository root.
#
# Cargo steps pass --locked, which fails the run when vdb-core/Cargo.lock is
# out of date instead of silently updating it. Keep the flag on every cargo
# step that accepts it.
#
# The three jobs declare no needs, so they start together. Nothing one of them
# produces is read by another. The Python suite runs on the extension that job
# builds for itself, and the Rust suite compiles its own test binaries with
# `extension-module` off, which is a different feature set from the one the
# other two build.
name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'ATTRIBUTION.md'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain comes from rust-toolchain.toml and from nowhere else.
      # `rustup toolchain install` with no argument reads the channel and the
      # components out of the file, so the version installed is the version
      # that runs. Raising the pin there is the whole of a toolchain bump.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vdb-core
          # Shared with test-rust, which compiles the same debug profile from
          # the same lockfile. test-python does not share it, because a release
          # build has nothing in common with a debug one and the two would take
          # turns evicting each other under one key.
          shared-key: vdb-core
          # Save the cache on a failed run too, so a red gate still warms it.
          cache-on-failure: true
      - name: Check Rust formatting
        working-directory: vdb-core
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: vdb-core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From rust-toolchain.toml, as in the lint job. See the note there.
      # uv sync builds the extension with cargo, so this job needs a toolchain
      # even though it runs no cargo command of its own.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vdb-core
          # Its own key. This is the only job that builds the release profile,
          # which is what the wheel is and what maturin produces through the
          # build backend. Under the shared key it restored the lint job's debug
          # artefacts, which a release build cannot use, and then declined to
          # save its own because the key was already taken.
          shared-key: vdb-core-release
          cache-on-failure: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the extension and install the project
        # uv sync installs the project through the maturin backend, which is
        # how the extension is built for development.
        run: uv sync --locked --extra dev
      - name: Run the Python test suite
        # Scoped to the tests directory, as testpaths in pyproject.toml is, and
        # spread over four workers, as addopts there is.
        run: uv run --no-sync pytest tests

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From rust-toolchain.toml, as in the lint job. See the note there.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vdb-core
          shared-key: vdb-core
          cache-on-failure: true
      # The Rust tests link an executable, and an executable has to resolve
      # every libpython symbol it references. `cargo test` below turns
      # `extension-module` off so that PyO3 emits the `-lpython` line, and that
      # line needs `libpython3.x.so`, which lives in python3-dev. The runner
      # image ships the interpreter and `libpython3.12.so.1.0` but not the
      # symlink a linker resolves `-l` against, so this is not a no-op.
      #
      # Nothing else in the job needs it. This job neither builds the extension
      # nor installs the project, because the Rust tests read neither.
      - name: Install libpython so the Rust tests can link
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev
      - name: Run the Rust test suite
        working-directory: vdb-core
        # --no-default-features turns off this crate's `extension-module`
        # feature, which is on for every other cargo command and for the wheel.
        # See the comment on it in vdb-core/Cargo.toml.
        run: cargo test --workspace --locked --no-default-features
