# Builds cross-platform wheels and an sdist with maturin, then publishes them
# through GitHub trusted publishing (no API tokens required).
#
# Triggers:
#   - push of a tag matching v*, which builds and publishes
#   - workflow_dispatch, which builds and checks everything and publishes
#     nothing
#
# Tag routing, decided by the check-version job:
#   - a tag whose version is a PEP 440 release publishes to production PyPI
#   - a tag whose version is a PEP 440 prerelease, meaning an a, b, rc or dev
#     segment, builds and checks everything and publishes nothing
#   Tags must be the letter v followed by a PEP 440 version in its canonical
#   spelling, and the version must be the one pyproject.toml, the root
#   Cargo.toml's [workspace.package] and src/zeusdb_vector_database/__version__
#   declare.
#   check-version parses all four with the packaging library and fails the
#   run, before a single wheel is built, naming whichever disagreed or did not
#   parse. For a tag it also fails there when CHANGELOG.md holds no section for
#   the version, the section github-release reads for the release's notes. The
#   publish job reads its prerelease output and nothing else, so a tag is never
#   routed by searching its text for letters.
#
# Every tool a job installs is pinned to an exact version and checked against
# a published hash:
#   - uv, by its version and the SHA-256 GitHub publishes for its archive on
#     each runner, both in env below, which setup-uv checks
#   - CPython, by the exact build uv installs, which uv checks against the
#     SHA-256 in its own list of builds
#   - every Python package, by a file under .github/requirements/, installed
#     with --require-hashes, wheels only and no dependency resolution
#   - every container image, by its digest, with its tag in a comment beside it
#   - Rust, by rust-toolchain.toml, with each component checked by rustup
#   - cargo-cyclonedx, by its version, which cargo checks against the index
#   .github/requirements/maturin.txt names the maturin uv.lock names, and the
#   lint job in ci.yml fails when the two disagree. Dependabot raises the
#   action pins alone. The other pins move by hand, each proven by a dispatch
#   run. No job here builds through a compiler cache or restores anything from
#   the Actions cache, and no checkout keeps a credential.
#
# Every build job records a SHA-256 for each artefact as the first step after
# the build and uploads the artefacts and their digests straight after that,
# so the install checks and the audit run once the files have left the job.
# The publish job verifies every file in dist against those digests before
# attestation and before upload. It requires the six wheels and the sdist and
# no other file, and fails if one disagrees or is missing. That catches the
# artifact store altering a file and a file added after the builds.
#
# The audit job checks all six wheels against the stable ABI. The publish job
# needs it and a dispatch runs it, so a wheel that reaches outside the limited
# API fails every run.
#
# The publish job uploads through pypa/gh-action-pypi-publish, which exchanges
# the job's OIDC token for an index credential and mints a PEP 740 attestation
# for every file from that same identity, so PyPI verifies each file against
# this workflow and shows the provenance on the file's page. The GitHub
# artifact attestation generated the step before is a separate record in this
# repository's attestation store, and both are kept.
#
# Every action is pinned to a full commit SHA, with the release it corresponds
# to in the trailing comment. Dependabot raises the pins; see
# .github/dependabot.yml.
#
# Every job names its runner image, such as ubuntu-24.04, windows-2025-vs2026
# or macos-15, rather than a label such as ubuntu-latest or windows-latest
# that GitHub moves to a newer image on its own schedule. A change of image is
# a change to this file.
#
# A successful production publish is followed by github-release, which creates
# the GitHub Release for the tag from the matching CHANGELOG.md section, and
# fails when the tag has no such section. No other path reaches it, so a
# dispatch run and a prerelease tag create nothing.
#
# This filename is registered in the PyPI Trusted Publisher record. Renaming
# this file breaks publishing until the record is updated.
#
# Every wheel build passes --locked to maturin, which forwards it to cargo, so
# a release fails when Cargo.lock is out of date instead of resolving
# fresh. The sdist check passes it through maturin's build backend. The sdist
# command takes no such flag.
#
# One wheel per platform, six in total. The workspace's Cargo.toml enables
# pyo3/abi3-py310 on the pyo3 dependency, so a
# single build produces a cp310-abi3 wheel that loads on every CPython from
# 3.10 up, including releases that do not exist yet. That is why no job passes
# --find-interpreter and why none names an interpreter: with abi3 the wheel is
# the same whichever CPython builds it, and the tag comes from the cargo
# feature rather than from the interpreter.
#
# PyPy and the free-threaded builds cannot load a stable ABI wheel, so neither
# gets one. Both fall back to the sdist, which builds from source.
#
# Originally generated by: maturin v1.8.7
# Command: maturin generate-ci github
#
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # uv, and the SHA-256 GitHub publishes for its archive on each runner.
  PINNED_UV_VERSION: "0.13.5"
  PINNED_UV_SHA256_LINUX: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
  PINNED_UV_SHA256_WINDOWS: a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
  PINNED_UV_SHA256_MACOS: 743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73
  # The CPython builds uv installs, as uv names them. The floor is the oldest
  # version the package supports and the abi3 target, and the newest is the
  # newest CPython release.
  FLOOR_CPYTHON_LINUX: cpython-3.10.22-linux-x86_64-gnu
  NEWEST_CPYTHON_LINUX: cpython-3.15.1-linux-x86_64-gnu
  FLOOR_CPYTHON_WINDOWS: cpython-3.10.22-windows-x86_64-none
  NEWEST_CPYTHON_WINDOWS: cpython-3.15.1-windows-x86_64-none
  FLOOR_CPYTHON_MACOS: cpython-3.10.22-macos-aarch64-none
  NEWEST_CPYTHON_MACOS: cpython-3.15.1-macos-aarch64-none
  # uv takes no interpreter from the runner image.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  check-version:
    name: Check the four declared versions agree
    runs-on: ubuntu-24.04
    # A hung step fails the job here instead of at GitHub's six hour default.
    timeout-minutes: 15
    # Every build job needs this, so a mis-tagged release fails here in well
    # under a minute instead of after the wheel matrix has run. Its outputs are
    # what route the publish job.
    outputs:
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          enable-cache: false
      - name: Install packaging
        # tomllib reads the two TOML files, and it needs Python 3.11 or later,
        # so this job runs on the newest build. Nothing here builds the
        # package.
        run: |
          uv venv "$RUNNER_TEMP/gate" --python "$NEWEST_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/gate" --require-hashes --only-binary :all: --no-deps -r .github/requirements/check-version.txt
      - name: Compare the tag, pyproject.toml, Cargo.toml and __version__
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        # The four are parsed with PEP 440 semantics rather than compared as
        # strings alone, so a tag that is not a version at all, or carries a
        # local label PyPI would reject, fails here by name. They must also be
        # spelled canonically, because the GitHub Release job finds the
        # CHANGELOG.md section by the tag's text and maturin writes the
        # canonical spelling into the wheel, so `v0.8.0-rc1` is refused where
        # `v0.8.0rc1` is accepted. packaging is the reference implementation of
        # PEP 440, and .github/requirements/check-version.txt pins it by hash so
        # the run is reproducible.
        run: |
          "$RUNNER_TEMP/gate/bin/python" - <<'PY'
          import os, pathlib, re, sys, tomllib
          from packaging.version import InvalidVersion, Version

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def toml_version(path, table):
              text = pathlib.Path(path).read_text(encoding="utf-8-sig")
              data = tomllib.loads(text)
              # A workspace root declares the version once, in
              # [workspace.package], and a member takes it with
              # version.workspace = true. A single-crate manifest declares it
              # in [package].
              if table == "package" and "workspace" in data and "package" in data["workspace"]:
                  return data["workspace"]["package"]["version"]
              return data[table]["version"]

          declared = {
              "pyproject.toml": toml_version("pyproject.toml", "project"),
              "Cargo.toml": toml_version("Cargo.toml", "package"),
          }

          # Every member manifest must take the workspace's version rather
          # than spell one of its own, or the version read above is not the
          # one that member is built with.
          members = sorted(pathlib.Path("bindings").glob("*/Cargo.toml")) + sorted(pathlib.Path("crates").glob("*/Cargo.toml"))
          for manifest in members:
              member = tomllib.loads(manifest.read_text(encoding="utf-8-sig"))
              if member.get("package", {}).get("version") != {"workspace": True}:
                  fail(f"{manifest.as_posix()} declares a version of its own rather than "
                       "version.workspace = true")
              print(f"{manifest.as_posix()} takes its version from the workspace")
          init_path = "src/zeusdb_vector_database/__init__.py"
          init = pathlib.Path(init_path).read_text(encoding="utf-8")
          found = re.search(r'^__version__ = "([^"]+)"$', init, re.MULTILINE)
          if found is None:
              fail(f"{init_path} declares no __version__")
          declared[init_path] = found.group(1)

          ref_type, ref_name = os.environ["REF_TYPE"], os.environ["REF_NAME"]
          if ref_type == "tag":
              if not ref_name.startswith("v"):
                  fail(f"tag {ref_name} does not start with v")
              declared[f"tag {ref_name}"] = ref_name[1:]

          parsed = {}
          for source, text in declared.items():
              try:
                  parsed[source] = Version(text)
              except InvalidVersion:
                  fail(f"{source} declares {text!r}, which is not a PEP 440 version")
              if str(parsed[source]) != text:
                  fail(f"{source} declares {text!r}, which is not the canonical PEP 440 "
                       f"spelling {str(parsed[source])!r}")
              if parsed[source].local is not None:
                  fail(f"{source} declares {text!r}, which carries a local version label "
                       "that PyPI rejects")

          width = max(len(source) for source in declared)
          for source, text in declared.items():
              print(f"{source:{width}}  {text}")
          if len(set(parsed.values())) != 1:
              fail("the declared versions disagree: "
                   + ", ".join(f"{source} says {text}" for source, text in declared.items()))

          version = parsed["pyproject.toml"]
          prerelease = "true" if version.is_prerelease else "false"
          print(f"version {version}, prerelease {prerelease}")

          # A tag must have its CHANGELOG.md section, the one github-release
          # reads for the release's notes, so a tag without notes fails here
          # before a single wheel is built. The match is that job's: a line
          # that starts with the heading, then at least one line other than a
          # blank or a rule before the next section's heading.
          if ref_type == "tag":
              heading = f"## [{version}]"
              lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8-sig").splitlines()
              start = next((i for i, line in enumerate(lines) if line.startswith(heading)), None)
              if start is None:
                  fail(f"CHANGELOG.md holds no '{heading}' section for tag {ref_name}")
              section = []
              for line in lines[start + 1:]:
                  if line.startswith("## ["):
                      break
                  section.append(line)
              if not any(line.strip() and not re.fullmatch(r"-{3,}\s*", line) for line in section):
                  fail(f"the '{heading}' section of CHANGELOG.md holds nothing for tag {ref_name}")
              print(f"CHANGELOG.md holds the '{heading}' section")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\nprerelease={prerelease}\n")
          PY

  linux:
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    # 30 rather than the 15 elsewhere, as on every wheel build. The emulated
    # aarch64 and the Windows builds run past 12 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            rust-target: x86_64-unknown-linux-gnu
            docker-platform: linux/amd64
            # quay.io/pypa/manylinux2014_x86_64, tag latest
            image: quay.io/pypa/manylinux2014_x86_64@sha256:2bd80fa8fca6b775a913b7e42fa410c5f2246fb6f7f8f3280b5d562e5ca5d63f
          - runner: ubuntu-24.04
            target: aarch64
            rust-target: aarch64-unknown-linux-gnu
            docker-platform: linux/arm64
            # ghcr.io/rust-cross/manylinux2014-cross, tag aarch64
            image: ghcr.io/rust-cross/manylinux2014-cross@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
    env:
      # The install check's two images. Each digest names a multi-platform
      # index, so the aarch64 leg runs the same images under QEMU.
      # python, tag 3.10-slim
      FLOOR_IMAGE: python@sha256:6ff506466f8b1e981719b468cc0023b8ef000b983cdec0eafe119d01f379e31d
      # python, tag 3.15-slim
      NEWEST_IMAGE: python@sha256:044d5bd747976e21f8bc4d746c3479b19a84bb8ae6261b802acdd26b29036c93
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          enable-cache: false
      - name: Install maturin
        # Into an environment of its own on the floor build, from the
        # hash-locked file. The wheel holds a static binary, which the build
        # image runs from a read-only mount.
        run: |
          uv venv "$RUNNER_TEMP/maturin" --python "$FLOOR_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/maturin" --require-hashes --only-binary :all: --no-deps -r .github/requirements/maturin.txt
      - name: Build wheels
        # In the pinned build image, through .github/scripts/build-linux-wheel.sh,
        # which installs the toolchain rust-toolchain.toml names and nothing
        # else. No token and no other credential enters the container.
        env:
          IMAGE: ${{ matrix.platform.image }}
          RUST_TARGET: ${{ matrix.platform.rust-target }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --volume "$RUNNER_TEMP/maturin/bin/maturin:/usr/local/bin/maturin:ro" \
            --workdir /io \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TERM_COLOR=always \
            "$IMAGE" \
            bash .github/scripts/build-linux-wheel.sh "$RUST_TARGET" auto
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Record the digest of every artefact before anything else touches it
        # The first step after the build, so the digest is of the wheel as
        # maturin wrote it, and the two uploads follow at once, before the
        # install check and the audit. The publish job verifies every artefact
        # against these digests before it attests or uploads anything. bash on
        # every runner, because the step is the same text on all five.
        # sha256sum on Linux and on the Git Bash of the Windows runner,
        # shasum on macOS, which has no sha256sum and whose shasum writes the
        # same two-space format sha256sum --check reads.
        shell: bash
        env:
          DIGEST_NAME: linux-${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          mkdir -p digests
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          else
            shasum -a 256 -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          fi
          cat "../digests/SHA256SUMS-${DIGEST_NAME}"
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-linux-${{ matrix.platform.target }}
          path: digests
      - name: Set up QEMU
        if: matrix.platform.docker-platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # docker.io/tonistiigi/binfmt, tag latest
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Install and import the built wheel on two interpreters
        # Runs in a glibc container matching the wheel architecture. A native
        # wheel cannot be handed to another job, so the check runs where the
        # wheel is built.
        #
        # Two interpreters rather than one, because an abi3 wheel claims to
        # load on every CPython from 3.10 up and one install proves only the
        # version it was installed on. The floor and the newest release
        # bracket the claim.
        run: |
          for image in "$FLOOR_IMAGE" "$NEWEST_IMAGE"; do
            docker run --rm --platform ${{ matrix.platform.docker-platform }} \
              --volume "${{ github.workspace }}/dist:/dist:ro" \
              "$image" \
              sh -c 'python -m pip install --no-index --no-deps --find-links /dist zeusdb-vector-database && python -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"'
          done

  musllinux:
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    # 30 rather than the 15 elsewhere, as on every wheel build. The emulated
    # aarch64 and the Windows builds run past 12 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            rust-target: x86_64-unknown-linux-musl
            docker-platform: linux/amd64
            # ghcr.io/rust-cross/rust-musl-cross, tag x86_64-musl
            image: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
          - runner: ubuntu-24.04
            target: aarch64
            rust-target: aarch64-unknown-linux-musl
            docker-platform: linux/arm64
            # ghcr.io/rust-cross/rust-musl-cross, tag aarch64-musl
            image: ghcr.io/rust-cross/rust-musl-cross@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
    env:
      # The install check's two images, multi-platform as in the linux job.
      # python, tag 3.10-alpine
      FLOOR_IMAGE: python@sha256:8ca9f9d0f4df2af674092e7e9d79ce7985e783cecfe070f8ea850801b6520bf7
      # python, tag 3.15-alpine
      NEWEST_IMAGE: python@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          enable-cache: false
      - name: Install maturin
        # See the linux job.
        run: |
          uv venv "$RUNNER_TEMP/maturin" --python "$FLOOR_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/maturin" --require-hashes --only-binary :all: --no-deps -r .github/requirements/maturin.txt
      - name: Build wheels
        # See the linux job. musllinux_1_2 is the tag every musllinux wheel
        # has carried.
        env:
          IMAGE: ${{ matrix.platform.image }}
          RUST_TARGET: ${{ matrix.platform.rust-target }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" \
            --volume "$RUNNER_TEMP/maturin/bin/maturin:/usr/local/bin/maturin:ro" \
            --workdir /io \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TERM_COLOR=always \
            "$IMAGE" \
            bash .github/scripts/build-linux-wheel.sh "$RUST_TARGET" musllinux_1_2
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Record the digest of every artefact before anything else touches it
        # See the linux job for why this sits here.
        shell: bash
        env:
          DIGEST_NAME: musllinux-${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          mkdir -p digests
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          else
            shasum -a 256 -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          fi
          cat "../digests/SHA256SUMS-${DIGEST_NAME}"
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-musllinux-${{ matrix.platform.target }}
          path: digests
      - name: Set up QEMU
        if: matrix.platform.docker-platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # docker.io/tonistiigi/binfmt, tag latest
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Install and import the built wheel on two interpreters
        # Runs in a musl container, because a musllinux wheel does not install
        # on the glibc runner that builds it. The floor and the newest release
        # bracket the abi3 claim.
        run: |
          for image in "$FLOOR_IMAGE" "$NEWEST_IMAGE"; do
            docker run --rm --platform ${{ matrix.platform.docker-platform }} \
              --volume "${{ github.workspace }}/dist:/dist:ro" \
              "$image" \
              sh -c 'python -m pip install --no-index --no-deps --find-links /dist zeusdb-vector-database && python -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"'
          done

  windows:
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    # 30 rather than the 15 elsewhere, as on every wheel build. The emulated
    # aarch64 and the Windows builds run past 12 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: windows-2025-vs2026
            target: x64
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_WINDOWS }}
          enable-cache: false
      # From rust-toolchain.toml, as in ci.yml.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install maturin
        # Into an environment of its own on the floor build, from the
        # hash-locked file.
        shell: pwsh
        run: |
          uv venv "$env:RUNNER_TEMP\maturin" --python $env:FLOOR_CPYTHON_WINDOWS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python "$env:RUNNER_TEMP\maturin" --require-hashes --only-binary :all: --no-deps -r .github/requirements/maturin.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build wheels
        # The floor build's environment is first on PATH. maturin generates
        # the stable ABI's import library itself, so the wheel needs no
        # interpreter to link.
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\maturin\Scripts;$env:PATH"
          maturin build --release --locked --out dist --target ${{ matrix.platform.rust-target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record the digest of every artefact before anything else touches it
        # See the linux job for why this sits here.
        shell: bash
        env:
          DIGEST_NAME: windows-${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          mkdir -p digests
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          else
            shasum -a 256 -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          fi
          cat "../digests/SHA256SUMS-${DIGEST_NAME}"
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-windows-${{ matrix.platform.target }}
          path: digests
      - name: Install and import the built wheel on two interpreters
        # One install proves only the version it ran on, so the floor and the
        # newest release are both exercised. Each native call is checked,
        # because the runner only inspects the exit code of the last one.
        shell: pwsh
        run: |
          $interpreters = [ordered]@{
            'floor' = $env:FLOOR_CPYTHON_WINDOWS
            'newest' = $env:NEWEST_CPYTHON_WINDOWS
          }
          foreach ($entry in $interpreters.GetEnumerator()) {
            $venv = Join-Path $env:RUNNER_TEMP "wheel-check-$($entry.Key)"
            uv venv $venv --python $entry.Value
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            uv pip install --python $venv --no-index --no-deps --find-links dist zeusdb-vector-database
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $py = Join-Path $venv 'Scripts\python.exe'
            & $py -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  macos:
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    # 30 rather than the 15 elsewhere, as on every wheel build. The emulated
    # aarch64 and the Windows builds run past 12 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
            rust-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_MACOS }}
          enable-cache: false
      # From rust-toolchain.toml, as in ci.yml.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install maturin
        # Into an environment of its own on the floor build, from the
        # hash-locked file.
        run: |
          uv venv "$RUNNER_TEMP/maturin" --python "$FLOOR_CPYTHON_MACOS"
          uv pip install --python "$RUNNER_TEMP/maturin" --require-hashes --only-binary :all: --no-deps -r .github/requirements/maturin.txt
      - name: Build wheels
        # The floor build's environment is first on PATH, so the interpreter
        # maturin finds there is the floor.
        run: |
          export PATH="$RUNNER_TEMP/maturin/bin:$PATH"
          maturin build --release --locked --out dist --target ${{ matrix.platform.rust-target }}
      - name: Record the digest of every artefact before anything else touches it
        # See the linux job for why this sits here.
        shell: bash
        env:
          DIGEST_NAME: macos-${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          mkdir -p digests
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          else
            shasum -a 256 -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          fi
          cat "../digests/SHA256SUMS-${DIGEST_NAME}"
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-macos-${{ matrix.platform.target }}
          path: digests
      - name: Install and import the built wheel on two interpreters
        # One install proves only the version it ran on, so the floor and the
        # newest release are both exercised.
        run: |
          check() {
            venv="$RUNNER_TEMP/wheel-check-$2"
            uv venv "$venv" --python "$1"
            uv pip install --python "$venv" --no-index --no-deps --find-links dist zeusdb-vector-database
            "$venv/bin/python" -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"
          }
          check "$FLOOR_CPYTHON_MACOS" floor
          check "$NEWEST_CPYTHON_MACOS" newest

  sdist:
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          enable-cache: false
      # From rust-toolchain.toml, as in ci.yml. maturin sdist reads the
      # workspace through cargo, and the check below compiles the archive.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install maturin
        # Into an environment of its own on the floor build, from the
        # hash-locked file.
        run: |
          uv venv "$RUNNER_TEMP/maturin" --python "$FLOOR_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/maturin" --require-hashes --only-binary :all: --no-deps -r .github/requirements/maturin.txt
      - name: Build sdist
        run: '"$RUNNER_TEMP/maturin/bin/maturin" sdist --out dist'
      - name: Record the digest of every artefact before anything else touches it
        # See the linux job for why this sits here.
        shell: bash
        env:
          DIGEST_NAME: sdist
        run: |
          set -euo pipefail
          mkdir -p digests
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          else
            shasum -a 256 -- * > "../digests/SHA256SUMS-${DIGEST_NAME}"
          fi
          cat "../digests/SHA256SUMS-${DIGEST_NAME}"
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist
      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-sdist
          path: digests
      - name: Build the extension from the unpacked sdist
        # The sdist layout differs from the working tree, so a manifest-path or
        # a python-source that resolves in the tree can still fail in the
        # archive. Installing the archive is the only check that catches it.
        #
        # It runs on the floor build, with the hash-locked maturin as the build
        # backend and the hash-locked numpy as the one runtime dependency, and
        # fetches no other package. The archive carries no
        # rust-toolchain.toml, so RUSTUP_TOOLCHAIN names the toolchain that
        # file names, and MATURIN_PEP517_ARGS passes --locked to cargo.
        env:
          MATURIN_PEP517_ARGS: --locked
        run: |
          set -euo pipefail
          tar -tzf dist/*.tar.gz
          uv venv "$RUNNER_TEMP/sdist-check" --python "$FLOOR_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/sdist-check" --require-hashes --only-binary :all: --no-deps \
            -r .github/requirements/maturin.txt -r .github/requirements/sdist-check.txt
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN
          uv pip install --python "$RUNNER_TEMP/sdist-check" --no-build-isolation --no-deps --no-index dist/*.tar.gz
          "$RUNNER_TEMP/sdist-check/bin/python" -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"

  audit:
    name: Audit the wheels against the stable ABI
    needs: [linux, musllinux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          enable-cache: false
      - name: Download the six wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Audit every wheel against the stable ABI
        # Before any wheel can be published, and in a dispatch run as well,
        # since this job is not conditional on the tag. abi3audit reads ELF, PE
        # and Mach-O alike, so one Linux job audits every platform's wheel.
        # --strict makes any violation or version mismatch a failure rather
        # than a note.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 6 ]; then
            echo "::error::expected six wheels and found ${#wheels[@]}"
            exit 1
          fi
          uv venv "$RUNNER_TEMP/abi3audit" --python "$NEWEST_CPYTHON_LINUX"
          uv pip install --python "$RUNNER_TEMP/abi3audit" --require-hashes --only-binary :all: --no-deps -r .github/requirements/abi3audit.txt
          "$RUNNER_TEMP/abi3audit/bin/abi3audit" --strict --verbose --assume-minimum-abi3 3.10 "${wheels[@]}"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Stable tags only, as check-version parsed them. A dispatch run never
    # reaches production. The comparison is against the string 'false' rather
    # than a negation, so an output that was never written skips this job
    # rather than publishing on it.
    if: >-
      ${{ github.event_name == 'push'
      && needs.check-version.outputs.prerelease == 'false' }}
    needs: [check-version, linux, musllinux, windows, macos, sdist, audit]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/project/zeusdb-vector-database/
    steps:
      - name: Download and merge all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download the digests recorded at build time
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: Verify every artefact against the digest recorded when it was built
        # Before attestation and before upload, so nothing is signed or
        # published that is not byte for byte what its build job produced.
        # Three checks: dist holds the six wheels and the sdist and no other
        # file, every file in dist has a recorded digest, and every recorded
        # digest matches. --strict makes a malformed line a failure rather
        # than a warning. A job that fails here has caught a file changed or
        # added between its build and this point, in the artifact store or by
        # any step that could upload, and the run stops with nothing uploaded.
        run: |
          set -euo pipefail
          ls -l digests
          wheels=$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)
          archives=$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
          actual=$(find dist -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$wheels" -ne 6 ] || [ "$archives" -ne 1 ] || [ "$actual" -ne 7 ]; then
            echo "::error::dist must hold six wheels and one sdist and nothing else, and holds $actual file(s), $wheels of them wheels and $archives of them sdists."
            exit 1
          fi
          expected=$(cat digests/SHA256SUMS-* | wc -l)
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::dist holds $actual file(s) but $expected digest line(s) were recorded at build time."
            exit 1
          fi
          cd dist
          for sums in ../digests/SHA256SUMS-*; do
            sha256sum --check --strict "$sums"
          done

      - name: Inspect build artifacts
        run: |
          echo "Contents of dist/ directory:"
          ls -lh dist/
          echo ""
          echo "File types of artifacts:"
          file dist/* || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        # Trusted Publishing against production PyPI, which is the action's
        # default index, so no repository-url here. The action exchanges the
        # job's OIDC token for a PyPI credential, runs twine check over dist,
        # mints a PEP 740 attestation for every file from that same identity
        # and uploads the files with their attestations. skip-existing keeps
        # the behaviour of the previous upload step, so a rerun does not fail
        # on a file an earlier run already uploaded.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          skip-existing: true

  github-release:
    name: Create the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No condition of its own. A job whose needs were skipped is skipped in
    # turn, so this runs exactly when publish-pypi ran and succeeded, which is
    # a stable tag push that reached production PyPI. A dispatch run skips
    # publish-pypi and therefore skips this, and a prerelease tag does the
    # same. A failed publish leaves it unrun, because needs defaults to
    # requiring success.
    needs: [publish-pypi]
    permissions:
      # Creating a release writes to the repository. Nothing else is needed
      # here, and no other job gains anything from this declaration.
      contents: write
    steps:
      # Checks out the tag, so CHANGELOG.md is the file the release was cut
      # from rather than whatever main holds now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A re-run of the workflow on the same tag must not go red because the
      # release is already there, and it must not overwrite a body that was
      # edited by hand after the first run. It is its own step so the steps
      # below can be skipped rather than exited from, which is what keeps a
      # re-run from paying to build the SBOM a second time.
      - name: Check whether the release already exists
        id: existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Leaving it untouched."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the dependency SBOM
        if: steps.existing.outputs.found == 'false'
        # A CycloneDX listing of every crate the wheel links, read from
        # Cargo.lock and attached to the release beside the notes.
        # The wheel is one compiled object, so a user who installs it cannot
        # enumerate what is inside it, and this is the file that answers that.
        #
        # Nothing here publishes to crates.io. cargo-cyclonedx reads the
        # lockfile and writes JSON, and that is the whole of it.
        #
        # --target all covers every platform the wheel matrix builds, so the
        # listing is not the runner's own dependency graph. Dev dependencies
        # are excluded by construction, so tempfile and the crates only it
        # brings in are absent, because cargo test compiles them and no wheel
        # ships them.
        #
        # cargo is already on the runner image, so only cargo-cyclonedx is
        # installed, and compiling it is the whole cost of this step. Its
        # version is named, cargo checks the crate against the crates.io index,
        # and --locked builds it with the dependencies its own lock file
        # records.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo install --locked --version 0.5.9 cargo-cyclonedx
          cargo cyclonedx \
            --manifest-path bindings/python/Cargo.toml \
            --format json \
            --describe crate \
            --target all \
            --spec-version 1.5
          mv bindings/python/zeusdb-vector-python.cdx.json \
             "$RUNNER_TEMP/zeusdb-vector-database-${TAG#v}.cdx.json"
          ls -lh "$RUNNER_TEMP"/*.cdx.json

      - name: Create the release from the changelog section for this tag
        if: steps.existing.outputs.found == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          sbom="$RUNNER_TEMP/zeusdb-vector-database-${version}.cdx.json"

          # Prints the section for this version, from the line after its
          # heading to the line before the next one. Leading blank lines, and
          # the trailing blank lines and horizontal rule that separate the
          # section from the next, are dropped. Blank lines and rules inside
          # the section are held back and flushed once more content follows,
          # so the body keeps its internal shape.
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 && !found { found = 1; grab = 1; next }
            grab && index($0, "## [") == 1 { exit }
            grab {
              if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^-{3,}[[:space:]]*$/) { hold[held++] = $0; next }
              if (started) { for (i = 0; i < held; i++) print hold[i] }
              held = 0
              started = 1
              print
            }
          ' CHANGELOG.md > "$notes"

          # check-version refuses a tag whose section is missing before any
          # build, and this check stays as a second guard. A run that reaches
          # it with no notes fails and creates no release, so a release is
          # never published without its notes.
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md holds no '## [${version}]' section, so no release was created."
            exit 1
          fi

          # --latest is deliberately absent. Its default is automatic, by date
          # and version, which marks the newest release latest and leaves an
          # older tag alone. Passing --latest would mark any tag latest.
          #
          # The SBOM is the only artifact attached. PyPI serves the wheels and
          # the sdist and GitHub attaches the source archives on its own, but
          # nothing else publishes the crate listing, and a release is where
          # someone auditing a version would look for it.
          gh release create "$TAG" \
            --verify-tag \
            --title "Version ${version}" \
            --notes-file "$notes" \
            "${sbom}#Software Bill of Materials (CycloneDX 1.5)"
