# Builds cross-platform wheels and an sdist with maturin, then publishes them
# through GitHub trusted publishing (no API tokens required).
#
# Triggers:
#   - push of a tag matching v*, which builds and publishes
#   - workflow_dispatch, which builds everything and only publishes when the
#     publish input is ticked
#
# Tag routing:
#   - a tag containing a, b or rc carries a PEP 440 prerelease segment and
#     publishes to TestPyPI
#   - any other v* tag publishes to production PyPI
#   Tags must be the letter v followed by a PEP 440 version. A tag holding the
#   letters a, b or rc anywhere routes to TestPyPI, so a stable tag must not
#   contain them.
#
# A workflow_dispatch run can only ever reach TestPyPI. Production publishing
# requires a stable tag.
#
# A successful production publish is followed by github-release, which creates
# the GitHub Release for the tag from the matching CHANGELOG.md section. No
# other path reaches it, so a dispatch run and a prerelease tag create nothing.
#
# This filename is registered in the PyPI and TestPyPI Trusted Publisher
# records. Renaming this file breaks publishing until both records are updated.
#
# Every wheel build passes --locked to maturin, which forwards it to cargo, so
# a release fails when vdb-core/Cargo.lock is out of date instead of resolving
# fresh. The sdist command takes no such flag.
#
# One wheel per platform, six in total. vdb-core enables pyo3/abi3-py310, so a
# single build produces a cp310-abi3 wheel that loads on every CPython from
# 3.10 up, including releases that do not exist yet. That is why no job passes
# --find-interpreter and why none names an interpreter: with abi3 the wheel is
# the same whichever CPython builds it, and the tag comes from the cargo
# feature rather than from the interpreter. Version 0.5.0 shipped 41 wheels.
#
# PyPy and the free-threaded builds cannot load a stable ABI wheel, so neither
# gets one. Both fall back to the sdist, which builds from source.
#
# Originally generated by: maturin v1.8.7
# Command: maturin generate-ci github
#
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to TestPyPI'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            docker-platform: linux/amd64
          - runner: ubuntu-24.04
            target: aarch64
            docker-platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --locked
          sccache: true  # Always use sccache for manual Dispatch
          manylinux: auto
      - name: Audit the wheel against the stable ABI
        # Runs before the wheel is uploaded, so a wheel that reaches outside
        # the limited API never becomes an artifact the publish job can
        # collect. It runs here rather than in the publish job because the
        # publish jobs are conditional on the tag, and a dispatch run with the
        # box unticked would skip the gate entirely. --strict makes any
        # violation or version mismatch a failure rather than a note.
        run: |
          python -m pip install --disable-pip-version-check abi3audit
          abi3audit --strict --verbose --assume-minimum-abi3 3.10 dist/*.whl
      - name: Set up QEMU
        if: matrix.platform.docker-platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - name: Install and import the built wheel on two interpreters
        # Runs in a glibc container matching the wheel architecture. A native
        # wheel cannot be handed to another job, so the check runs where the
        # wheel is built.
        #
        # Two interpreters rather than one, because an abi3 wheel claims to
        # load on every CPython from 3.10 up and one install proves only the
        # version it was installed on. The floor and the newest release
        # bracket the claim.
        run: |
          for tag in 3.10-slim 3.14-slim; do
            docker run --rm --platform ${{ matrix.platform.docker-platform }} \
              --volume "${{ github.workspace }}/dist:/dist:ro" \
              "python:$tag" \
              sh -c 'python -m pip install --no-index --no-deps --find-links /dist zeusdb-vector-database && python -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"'
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            docker-platform: linux/amd64
          - runner: ubuntu-24.04
            target: aarch64
            docker-platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --locked
          sccache: true  # Always use sccache for manual Dispatch
          manylinux: musllinux_1_2
      - name: Audit the wheel against the stable ABI
        # See the linux job for why the gate sits here.
        run: |
          python -m pip install --disable-pip-version-check abi3audit
          abi3audit --strict --verbose --assume-minimum-abi3 3.10 dist/*.whl
      - name: Set up QEMU
        if: matrix.platform.docker-platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - name: Install and import the built wheel on two interpreters
        # Runs in a musl container, because a musllinux wheel does not install
        # on the glibc runner that builds it. The floor and the newest release
        # bracket the abi3 claim.
        run: |
          for tag in 3.10-alpine 3.14-alpine; do
            docker run --rm --platform ${{ matrix.platform.docker-platform }} \
              --volume "${{ github.workspace }}/dist:/dist:ro" \
              "python:$tag" \
              sh -c 'python -m pip install --no-index --no-deps --find-links /dist zeusdb-vector-database && python -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"'
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      # Two interpreters, the abi3 floor and the newest release, so the wheel
      # can be installed on both below. 3.10 is set up last so that it is the
      # one on PATH when maturin runs.
      - uses: actions/setup-python@v7
        id: py314
        with:
          python-version: '3.14'
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v7
        id: py310
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --locked
          sccache: true  # Always use sccache for manual Dispatch
      - name: Audit the wheel against the stable ABI
        # See the linux job for why the gate sits here.
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check abi3audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/*.whl).FullName
          abi3audit --strict --verbose --assume-minimum-abi3 3.10 $wheel
      - name: Install and import the built wheel on two interpreters
        # One install proves only the version it ran on, so the floor and the
        # newest release are both exercised. Each native call is checked,
        # because the runner only inspects the exit code of the last one.
        shell: pwsh
        run: |
          $interpreters = [ordered]@{
            '3.10' = '${{ steps.py310.outputs.python-path }}'
            '3.14' = '${{ steps.py314.outputs.python-path }}'
          }
          foreach ($entry in $interpreters.GetEnumerator()) {
            $venv = Join-Path $env:RUNNER_TEMP "wheel-check-$($entry.Key)"
            & $entry.Value -m venv $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $py = Join-Path $venv 'Scripts\python.exe'
            & $py -m pip install --no-index --no-deps --find-links dist zeusdb-vector-database
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $py -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      # Two interpreters, the abi3 floor and the newest release, so the wheel
      # can be installed on both below. 3.10 is set up last so that it is the
      # one on PATH when maturin runs.
      - uses: actions/setup-python@v7
        id: py314
        with:
          python-version: '3.14'
      - uses: actions/setup-python@v7
        id: py310
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --locked
          sccache: true
      - name: Audit the wheel against the stable ABI
        # See the linux job for why the gate sits here.
        run: |
          python -m pip install --disable-pip-version-check abi3audit
          abi3audit --strict --verbose --assume-minimum-abi3 3.10 dist/*.whl
      - name: Install and import the built wheel on two interpreters
        # One install proves only the version it ran on, so the floor and the
        # newest release are both exercised.
        run: |
          check() {
            venv="$RUNNER_TEMP/wheel-check-$2"
            "$1" -m venv "$venv"
            "$venv/bin/python" -m pip install --no-index --no-deps --find-links dist zeusdb-vector-database
            "$venv/bin/python" -c "import sys, zeusdb_vector_database as zvd; print(sys.version.split()[0], zvd.__version__)"
          }
          check '${{ steps.py310.outputs.python-path }}' 3.10
          check '${{ steps.py314.outputs.python-path }}' 3.14
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build the extension from the unpacked sdist
        # The sdist layout differs from the working tree, so a manifest-path or
        # a python-source that resolves in the tree can still fail in the
        # archive. Installing the archive is the only check that catches it.
        run: |
          tar -tzf dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/sdist-check"
          "$RUNNER_TEMP/sdist-check/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sdist-check/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-check/bin/python" -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    # Prerelease tags, and dispatch runs with the publish box ticked.
    if: >-
      ${{ (github.event_name == 'push'
      && (contains(github.ref_name, 'a')
      || contains(github.ref_name, 'b')
      || contains(github.ref_name, 'rc')))
      || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/zeusdb-vector-database/
    steps:
      - name: Download and merge all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Inspect build artifacts
        run: |
          echo "Contents of dist/ directory:"
          ls -lh dist/
          echo ""
          echo "File types of artifacts:"
          file dist/* || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to TestPyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing --repository testpypi dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Stable tags only. A dispatch run never reaches production.
    if: >-
      ${{ github.event_name == 'push'
      && !(contains(github.ref_name, 'a')
      || contains(github.ref_name, 'b')
      || contains(github.ref_name, 'rc')) }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/project/zeusdb-vector-database/
    steps:
      - name: Download and merge all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Inspect build artifacts
        run: |
          echo "Contents of dist/ directory:"
          ls -lh dist/
          echo ""
          echo "File types of artifacts:"
          file dist/* || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  github-release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    # No condition of its own. A job whose needs were skipped is skipped in
    # turn, so this runs exactly when publish-pypi ran and succeeded, which is
    # a stable tag push that reached production PyPI. A dispatch run skips
    # publish-pypi and therefore skips this, whether or not the publish box was
    # ticked, and a prerelease tag does the same. A failed publish leaves it
    # unrun, because needs defaults to requiring success.
    needs: [publish-pypi]
    permissions:
      # Creating a release writes to the repository. Nothing else is needed
      # here, and no other job gains anything from this declaration.
      contents: write
    steps:
      # Checks out the tag, so CHANGELOG.md is the file the release was cut
      # from rather than whatever main holds now.
      - uses: actions/checkout@v7

      # A re-run of the workflow on the same tag must not go red because the
      # release is already there, and it must not overwrite a body that was
      # edited by hand after the first run. It is its own step so the steps
      # below can be skipped rather than exited from, which is what keeps a
      # re-run from paying to build the SBOM a second time.
      - name: Check whether the release already exists
        id: existing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Leaving it untouched."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the dependency SBOM
        if: steps.existing.outputs.found == 'false'
        # A CycloneDX listing of every crate the wheel links, read from
        # vdb-core/Cargo.lock and attached to the release beside the notes.
        # The wheel is one compiled object, so a user who installs it cannot
        # enumerate what is inside it, and this is the file that answers that.
        #
        # Nothing here publishes to crates.io. cargo-cyclonedx reads the
        # lockfile and writes JSON, and that is the whole of it.
        #
        # --target all covers every platform the wheel matrix builds, so the
        # listing is not the runner's own dependency graph. Dev dependencies
        # are excluded by construction, so tempfile and the seven crates it
        # brings in are absent, because cargo test compiles them and no wheel
        # ships them. That gives 109 components against the 118 entries in
        # Cargo.lock, the last of which is the crate the SBOM describes.
        #
        # cargo is already on the runner image, so only cargo-cyclonedx is
        # installed. Compiling it is the whole cost of this step, measured at
        # 1 minute 10 seconds locally and expected to be a few minutes here.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx \
            --manifest-path vdb-core/Cargo.toml \
            --format json \
            --describe crate \
            --target all \
            --spec-version 1.5
          mv vdb-core/zeusdb-vector-database.cdx.json \
             "$RUNNER_TEMP/zeusdb-vector-database-${TAG#v}.cdx.json"
          ls -lh "$RUNNER_TEMP"/*.cdx.json

      - name: Create the release from the changelog section for this tag
        if: steps.existing.outputs.found == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          sbom="$RUNNER_TEMP/zeusdb-vector-database-${version}.cdx.json"

          # Prints the section for this version, from the line after its
          # heading to the line before the next one. Leading blank lines, and
          # the trailing blank lines and horizontal rule that separate the
          # section from the next, are dropped. Blank lines and rules inside
          # the section are held back and flushed once more content follows,
          # so the body keeps its internal shape.
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 && !found { found = 1; grab = 1; next }
            grab && index($0, "## [") == 1 { exit }
            grab {
              if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^-{3,}[[:space:]]*$/) { hold[held++] = $0; next }
              if (started) { for (i = 0; i < held; i++) print hold[i] }
              held = 0
              started = 1
              print
            }
          ' CHANGELOG.md > "$notes"

          # The package is already on PyPI by this point, so a missing section
          # is not worth failing the run over. The release is created with a
          # pointer instead of notes, and the warning annotation records that
          # the body needs writing by hand.
          if [ ! -s "$notes" ]; then
            echo "::warning::CHANGELOG.md holds no '## [${version}]' section. Creating the release with a pointer in place of notes."
            cat > "$notes" <<EOF
          No changelog section was found for ${version} when this release was created.

          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) and the [package on PyPI](https://pypi.org/project/zeusdb-vector-database/${version}/).
          EOF
          fi

          # --latest is deliberately absent. Its default is automatic, by date
          # and version, which marks the newest release latest and leaves an
          # older tag alone. Passing --latest would mark any tag latest.
          #
          # The SBOM is the only artifact attached. PyPI serves the wheels and
          # the sdist and GitHub attaches the source archives on its own, but
          # nothing else publishes the crate listing, and a release is where
          # someone auditing a version would look for it.
          gh release create "$TAG" \
            --verify-tag \
            --title "Version ${version}" \
            --notes-file "$notes" \
            "${sbom}#Software Bill of Materials (CycloneDX 1.5)"
