# Builds cross-platform wheels and an sdist with maturin, then publishes them
# through GitHub trusted publishing (no API tokens required).
#
# Triggers:
#   - push of a tag matching v*, which builds and publishes
#   - workflow_dispatch, which builds everything and only publishes when the
#     publish input is ticked
#
# Tag routing:
#   - a tag containing a, b or rc carries a PEP 440 prerelease segment and
#     publishes to TestPyPI
#   - any other v* tag publishes to production PyPI
#   Tags must be the letter v followed by a PEP 440 version. A tag holding the
#   letters a, b or rc anywhere routes to TestPyPI, so a stable tag must not
#   contain them.
#
# A workflow_dispatch run can only ever reach TestPyPI. Production publishing
# requires a stable tag.
#
# This filename is registered in the PyPI and TestPyPI Trusted Publisher
# records. Renaming this file breaks publishing until both records are updated.
#
# Originally generated by: maturin v1.8.7
# Command: maturin generate-ci github
#
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to TestPyPI'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            docker-platform: linux/amd64
          - runner: ubuntu-24.04
            target: aarch64
            docker-platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true  # Always use sccache for manual Dispatch
          manylinux: auto
      - name: Set up QEMU
        if: matrix.platform.docker-platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - name: Install and import the built wheel
        # Runs in a glibc container matching the wheel architecture. A native
        # wheel cannot be handed to another job, so the check runs where the
        # wheel is built.
        run: |
          docker run --rm --platform ${{ matrix.platform.docker-platform }} \
            --volume "${{ github.workspace }}/dist:/dist:ro" \
            python:3.10-slim \
            sh -c 'python -m pip install --no-index --no-deps --find-links /dist zeusdb-vector-database && python -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
            docker-platform: linux/amd64
          - runner: ubuntu-24.04
            target: aarch64
            docker-platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true  # Always use sccache for manual Dispatch
          manylinux: musllinux_1_2
      - name: Set up QEMU
        if: matrix.platform.docker-platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - name: Install and import the built wheel
        # Runs in a musl container, because a musllinux wheel does not install
        # on the glibc runner that builds it.
        run: |
          docker run --rm --platform ${{ matrix.platform.docker-platform }} \
            --volume "${{ github.workspace }}/dist:/dist:ro" \
            python:3.10-alpine \
            sh -c 'python -m pip install --no-index --no-deps --find-links /dist zeusdb-vector-database && python -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true  # Always use sccache for manual Dispatch
      - name: Install and import the built wheel
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\wheel-check"
          & "$env:RUNNER_TEMP\wheel-check\Scripts\python.exe" -m pip install --no-index --no-deps --find-links dist zeusdb-vector-database
          & "$env:RUNNER_TEMP\wheel-check\Scripts\python.exe" -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true  # A partial wheel set is worse than no release
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true
      - name: Install and import the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-index --no-deps --find-links dist zeusdb-vector-database
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match the minimum required version in pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Build the extension from the unpacked sdist
        # The sdist layout differs from the working tree, so a manifest-path or
        # a python-source that resolves in the tree can still fail in the
        # archive. Installing the archive is the only check that catches it.
        run: |
          tar -tzf dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/sdist-check"
          "$RUNNER_TEMP/sdist-check/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sdist-check/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-check/bin/python" -c "import zeusdb_vector_database as zvd; print(zvd.__version__)"
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    # Prerelease tags, and dispatch runs with the publish box ticked.
    if: >-
      ${{ (github.event_name == 'push'
      && (contains(github.ref_name, 'a')
      || contains(github.ref_name, 'b')
      || contains(github.ref_name, 'rc')))
      || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/zeusdb-vector-database/
    steps:
      - name: Download and merge all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Inspect build artifacts
        run: |
          echo "Contents of dist/ directory:"
          ls -lh dist/
          echo ""
          echo "File types of artifacts:"
          file dist/* || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to TestPyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing --repository testpypi dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Stable tags only. A dispatch run never reaches production.
    if: >-
      ${{ github.event_name == 'push'
      && !(contains(github.ref_name, 'a')
      || contains(github.ref_name, 'b')
      || contains(github.ref_name, 'rc')) }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/project/zeusdb-vector-database/
    steps:
      - name: Download and merge all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Inspect build artifacts
        run: |
          echo "Contents of dist/ directory:"
          ls -lh dist/
          echo ""
          echo "File types of artifacts:"
          file dist/* || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
