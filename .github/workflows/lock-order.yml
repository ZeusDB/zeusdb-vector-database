# The whole Python suite with the lock rank registry live.
#
# The registry in crates/hnsw/src/locks.rs is gated on
# `cfg(debug_assertions)` and on nothing else. Every gate in ci.yml builds the
# extension the way the wheel is built, which is a release build with the
# assertions off. The `checked` profile in the root Cargo.toml is the release
# profile with the assertions turned back on, and this workflow is where it
# runs.
#
# It runs on a pull request that touches a module where a lock is taken or
# held, on a weekly schedule, and by hand from the Actions tab. The path list
# is the set of source files that construct, take or hold one of the tracked
# guards, or are read under one. crates/hnsw/src/** holds the collection, its
# locks, the persistence that takes them to save and to load, and the rerank
# rule that rescores under the storage and metadata guards; crates/sparse/src/**
# is the sparse index, read and written under the sparse space's guard;
# graph/** holds the graph's own lock, pq.rs holds its own, and columns.rs and
# filter.rs are read under the columns guard. The binding takes no guard of
# its own, so a change
# there alone runs the release suite in ci.yml. The weekly run stays because a
# path trigger fires only on a commit here, and the runner image or a
# dependency can move without one.
#
# What it proves. That no code path any Python test reaches takes the same
# guard twice on one thread, and that none inverts the declared order. The
# assertion fires on the acquisition itself, with no writer and no scheduling.
#
# The suite runs on the checked build without tests/test_interpreter.py and
# tests/test_overlap.py, and those two modules then run alone on the checked
# build with the binding's test-support feature, since their checks arm pauses
# the wheel does not carry.
#
# The suite runs on the newest CPython release, the exact build test-python in
# ci.yml runs, which uv installs and checks against the SHA-256 in its own
# list. uv itself is pinned by version and by the SHA-256 of its archive.
# rust-cache's key holds the runner image's name and version, as in ci.yml.
#
# Every job names its runner image, ubuntu-24.04, rather than a label such as
# ubuntu-latest that GitHub moves to a newer image on its own schedule. A
# change of image is a change to this file.
name: Lock order

on:
  pull_request:
    branches: [main, development]
    # The modules named in the header. A change elsewhere, including to the
    # Python package and the tests, runs the release suite in ci.yml alone.
    paths:
      - 'crates/hnsw/src/**'
      - 'crates/sparse/src/**'
      - 'crates/core/src/graph/**'
      - 'crates/core/src/columns.rs'
      - 'crates/core/src/filter.rs'
      - 'crates/core/src/pq.rs'
      - '.github/workflows/lock-order.yml'
  schedule:
    # 04:17 UTC on Mondays, off the hour because the scheduler queues runs
    # filed on the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # uv, and the SHA-256 GitHub publishes for uv-x86_64-unknown-linux-gnu.tar.gz
  # at that version.
  PINNED_UV_VERSION: "0.13.5"
  PINNED_UV_SHA256_LINUX: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
  # uv takes no interpreter from the runner image.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lock-order:
    runs-on: ubuntu-24.04
    # Well above the expected run time so a slow runner does not fail the run,
    # and far enough below the six hour default to be a real bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From rust-toolchain.toml, as in ci.yml. See the note there.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          # Its own key. The `checked` profile is a third profile, beside the
          # debug one ci.yml's lint and test-rust jobs share and the release one
          # its test-python job keeps, so sharing either key would evict that
          # cache on every run of this one.
          shared-key: workspace-checked
          # The runner image's name and version, as in ci.yml.
          env-vars: ImageOS ImageVersion
          cache-on-failure: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          checksum: ${{ env.PINNED_UV_SHA256_LINUX }}
          # The newest CPython release, as uv names its build, the same as
          # test-python in ci.yml.
          python-version: cpython-3.15.1-linux-x86_64-gnu
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the project without building the extension
        # --no-install-project installs the dependencies and skips the package
        # itself, so the build below is the only one and there is no release
        # extension for it to overwrite.
        run: uv sync --locked --extra dev --no-install-project
      - name: Build the extension with debug assertions on
        run: uv run --no-sync maturin develop --profile checked --locked
      - name: Confirm the registry is actually in the built module
        # A suite that passes looks the same whether or not the profile still
        # carries the assertions. The assertion text is in the binary or it is
        # not.
        run: |
          module=$(uv run --no-sync python -c "import zeusdb_vector_database as z, pathlib; print(next(pathlib.Path(z.__file__).parent.glob('*.so')))")
          echo "checking $module"
          grep -q "inverts the declared" "$module"
          grep -q "taking the same guard twice" "$module"
      - name: Run the Python test suite
        # Four workers, from addopts in pyproject.toml. The registry is per
        # thread and each worker is its own process, so a worker sees only the
        # guards its own threads take, which is what the rule is about.
        run: uv run --no-sync pytest tests --ignore=tests/test_interpreter.py --ignore=tests/test_overlap.py
      - name: Build the extension with debug assertions and the test-support feature
        # The checked build with the pauses the checks of the next step arm.
        # See the feature in bindings/python/Cargo.toml.
        run: uv run --no-sync maturin develop --profile checked --locked --features test-support
      - name: Run the checks that need the test-support feature
        run: uv run --no-sync pytest tests/test_interpreter.py tests/test_overlap.py
