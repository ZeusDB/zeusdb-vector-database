# The whole Python suite with the lock rank registry live.
#
# The registry in vdb-core/src/hnsw_index/locks.rs is gated on
# `cfg(debug_assertions)` and on nothing else. Every gate in ci.yml builds the
# extension the way the wheel is built, which is a release build with the
# assertions off. The `checked` profile in vdb-core/Cargo.toml is the release
# profile with the assertions turned back on, and this workflow is where it
# runs.
#
# It runs on a pull request that touches a module where a lock is taken or
# held, on a weekly schedule, and by hand from the Actions tab. The path list
# is the set of source files that construct, take or hold one of the tracked
# guards, or are read under one. hnsw_index/** and graph/** hold the locks,
# pq.rs holds its own, persistence.rs takes the index's guards to save and to
# load, columns.rs and filter.rs are read under the columns guard, and
# rerank.rs rescores under the storage and metadata guards. The weekly run
# stays because a path trigger fires only on a commit here, and the runner
# image or a dependency can move without one.
#
# What it proves. That no code path any Python test reaches takes the same
# guard twice on one thread, and that none inverts the declared order. The
# assertion fires on the acquisition itself, with no writer and no scheduling.
name: Lock order

on:
  pull_request:
    branches: [main, development]
    # The modules named in the header. A change elsewhere, including to the
    # Python package and the tests, runs the release suite in ci.yml alone.
    paths:
      - 'vdb-core/src/hnsw_index/**'
      - 'vdb-core/src/graph/**'
      - 'vdb-core/src/columns.rs'
      - 'vdb-core/src/filter.rs'
      - 'vdb-core/src/persistence.rs'
      - 'vdb-core/src/pq.rs'
      - 'vdb-core/src/rerank.rs'
      - '.github/workflows/lock-order.yml'
  schedule:
    # 04:17 UTC on Mondays, off the hour because the scheduler queues runs
    # filed on the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock-order:
    runs-on: ubuntu-latest
    # Well above the expected run time so a slow runner does not fail the run,
    # and far enough below the six hour default to be a real bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From rust-toolchain.toml, as in ci.yml. See the note there.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vdb-core
          # Its own key. The `checked` profile is a third profile, beside the
          # debug one ci.yml's lint and test-rust jobs share and the release one
          # its test-python job keeps, so sharing either key would evict that
          # cache on every run of this one.
          shared-key: vdb-core-checked
          cache-on-failure: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the project without building the extension
        # --no-install-project installs the dependencies and skips the package
        # itself, so the build below is the only one and there is no release
        # extension for it to overwrite.
        run: uv sync --locked --extra dev --no-install-project
      - name: Build the extension with debug assertions on
        run: uv run --no-sync maturin develop --profile checked
      - name: Confirm the registry is actually in the built module
        # A suite that passes looks the same whether or not the profile still
        # carries the assertions. The assertion text is in the binary or it is
        # not.
        run: |
          module=$(uv run --no-sync python -c "import zeusdb_vector_database as z, pathlib; print(next(pathlib.Path(z.__file__).parent.glob('*.so')))")
          echo "checking $module"
          grep -q "inverts the declared" "$module"
          grep -q "taking the same guard twice" "$module"
      - name: Run the Python test suite
        # Four workers, from addopts in pyproject.toml. The registry is per
        # thread and each worker is its own process, so a worker sees only the
        # guards its own threads take, which is what the rule is about.
        run: uv run --no-sync pytest tests
