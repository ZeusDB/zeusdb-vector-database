# Checks the Rust dependency tree the wheel ships, with cargo-deny.
#
# The wheel is one compiled object. A user who installs it cannot enumerate the
# crates inside it, run an advisory check against them or read their licences,
# so the check runs here. What each pass allows is in deny.toml at the
# repository root, beside the workspace's Cargo.toml and Cargo.lock, which
# is where both passes run from.
#
# Two passes. The advisory pass writes SARIF and uploads it to code scanning,
# where a finding is triaged and dismissed with a recorded reason. The licence,
# ban and source pass runs last and its exit code is the job's.
#
# Keep continue-on-error on the advisory STEP rather than on the job. On the
# job it would cover the second pass as well.
#
# Separate from ci.yml because its result can change with no change to the
# repository. ci.yml's paths-ignore must not silence it.
name: Dependency scan

on:
  push:
    branches: [main, development]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'bindings/*/Cargo.toml'
      - 'crates/*/Cargo.toml'
      - '.github/workflows/dependency-scan.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'bindings/*/Cargo.toml'
      - 'crates/*/Cargo.toml'
      - '.github/workflows/dependency-scan.yml'
  schedule:
    # 02:15 UTC daily, off the hour because the shared scheduler queues runs
    # filed on the hour. A new advisory against a crate the tree already holds
    # arrives with no commit, so this is the trigger that reaches it.
    - cron: '15 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # A hung step fails the job here instead of at GitHub's six hour default.
    timeout-minutes: 15
    permissions:
      contents: read
      # Writing the SARIF report to code scanning. This is the whole reason the
      # job needs anything beyond read.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A prebuilt binary from cargo-deny's own GitHub releases, onto
      # $CARGO_HOME/bin. The two run steps below need to redirect SARIF to a
      # file and to handle each exit code separately.
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny

      - name: Scan for advisories
        continue-on-error: true
        # --format sarif makes cargo-deny exit 0 on a finding, verified against
        # 0.20.2. continue-on-error is here so that a future version changing
        # that does not alter the outcome. The next step catches the case this
        # hides, being cargo-deny not running at all.
        #
        # --locked, as every other cargo step in this project passes it, so the
        # scan reads the tree a release would build.
        run: |
          set -o pipefail
          cargo deny \
            --all-features \
            --locked \
            --format sarif \
            check advisories > "$RUNNER_TEMP/cargo-deny.sarif"

      - name: Confirm the scan produced a report
        # A scan that ran leaves valid SARIF whatever it found, and a scan that
        # could not reach the advisory database leaves nothing. A missing report
        # fails the job.
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/cargo-deny.sarif"
          if [ ! -s "$report" ]; then
            echo "::error::cargo-deny produced no SARIF report. The advisory scan did not run, so the Security tab still holds the previous results."
            exit 1
          fi
          count=$(python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          print(sum(len(run.get("results", [])) for run in report["runs"]))
          ' "$report")
          echo "::notice::cargo-deny reported ${count} advisory finding(s). See the Security tab under code scanning."

      - name: Upload the report to code scanning
        # Skipped for a pull request opened from a fork, which is not granted
        # security-events: write and could only fail here. Every other trigger
        # uploads, and the step is left blocking so a malformed report is caught
        # rather than silently dropped.
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/cargo-deny.sarif
          # Names this analysis, so a second SARIF source added later reports
          # alongside it rather than replacing its results.
          category: cargo-deny-advisories

      - name: Check licences, bans and sources
        # Last, so the report above reaches the Security tab whatever this does.
        # Human format on purpose, because --format sarif exits 0 on a finding
        # and this pass has to fail on one.
        run: |
          cargo deny \
            --all-features \
            --locked \
            check licenses bans sources
