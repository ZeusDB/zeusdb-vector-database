[project]
name = "zeusdb-vector-database"
version = "0.9.0"
description = "Blazing-fast vector DB with real-time similarity search and metadata filtering."
readme = "README.md"
authors = [
    { name = "ZeusDB", email = "contact@zeusdb.com" }
]
# The floor and the abi3 target move together. The workspace's Cargo.toml
# enables pyo3/abi3-py310, so the wheel is tagged cp310-abi3 and pip on 3.10 selects
# it. Raising one without the other leaves a version with no wheel that pip
# can match, which falls back to building the sdist from source.
requires-python = ">=3.10"
license = "Apache-2.0"
# CPython only, and now literally so. A stable ABI wheel cannot be loaded by
# PyPy or by a free-threaded build, so no wheel is produced for either.
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=2.2.6,<3.0.0"
]

[build-system]
requires = ["maturin>=1.9.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
# abi3-py310 is deliberately not listed here. maturin has no abi3 key and
# reads the target from the pyo3 cargo feature, which is declared on the
# pyo3 dependency in the workspace's Cargo.toml instead, so that cargo build,
# cargo clippy and cargo test compile the configuration the wheel ships
# rather than a different one.
features = ["pyo3/extension-module"]
python-source = "src"
# The binding crate, a member of the workspace whose manifest is at the root.
manifest-path = "bindings/python/Cargo.toml"
# The extension module inside the package, named by the #[pymodule]
# attribute in bindings/python/src/lib.rs. The crate name in Cargo.toml is
# a separate name and does not have to match.
module-name = "zeusdb_vector_database._engine"
bindings = "pyo3" # <-- explicitly state to maturin that it's a PyO3 project
include = [
    "LICENSE",
    "NOTICE",
    "README.md",
    "src/**",
]

[project.optional-dependencies]
dev = [
    "maturin >=1.9.3",
    "pytest >=8.4.0",
    "pytest-xdist >=3.8.0",
    "psutil >=7.0.0",
]

[tool.pytest.ini_options]
# Scopes collection to the tests directory.
testpaths = ["tests"]
# Four worker processes, always four rather than `auto`.
#
# `auto` reads the machine, so a developer machine and a runner would be
# different configurations and a result measured on one would say nothing about
# the other. Four is the vCPU count GitHub publishes for the standard
# ubuntu runner, which is what the gate runs on.
#
# It lives here rather than in a workflow because three call sites run this
# suite, ci.yml, lock-order.yml and the gate in CLAUDE.md, and one setting
# reaches all three without any of them repeating a flag.
#
# `--dist loadfile` keeps every test from one file on one worker. The
# alternative distributes test by test, which rebuilds each module scoped
# fixture on every worker that draws a test from that module, and this suite
# has sixteen of them.
#
# Pass `-n 0` to run in one process, which is what a debugger and a live `-s`
# want.
addopts = "-n 4 --dist loadfile"

[project.urls]
"Repository" = "https://github.com/zeusdb/zeusdb-vector-database"
"Documentation" = "https://docs.zeusdb.com/en/latest/vector_database/"
"Bug Tracker" = "https://github.com/zeusdb/zeusdb-vector-database/issues"