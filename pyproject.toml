[project]
name = "zeusdb-vector-database"
version = "0.5.0"
description = "Blazing-fast vector DB with real-time similarity search and metadata filtering."
readme = "README.md"
authors = [
    { name = "ZeusDB", email = "contact@zeusdb.com" }
]
# The floor and the abi3 target move together. vdb-core/Cargo.toml enables
# pyo3/abi3-py310, so the wheel is tagged cp310-abi3 and pip on 3.10 selects
# it. Raising one without the other leaves a version with no wheel that pip
# can match, which falls back to building the sdist from source.
requires-python = ">=3.10"
license = "Apache-2.0"
# CPython only, and now literally so. A stable ABI wheel cannot be loaded by
# PyPy or by a free-threaded build, so no wheel is produced for either.
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=2.2.6,<3.0.0"
]

[build-system]
requires = ["maturin>=1.9.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
# abi3-py310 is deliberately not listed here. maturin has no abi3 key and
# reads the target from the pyo3 cargo feature, which is declared in
# vdb-core/Cargo.toml instead, so that cargo build, cargo clippy and cargo
# test compile the configuration the wheel ships rather than a different one.
features = ["pyo3/extension-module"]
python-source = "src"
manifest-path = "vdb-core/Cargo.toml"
module-name = "zeusdb_vector_database" # <-- matches Rust crate name
bindings = "pyo3" # <-- explicitly state to maturin that it's a PyO3 project
# vendor/** must ship in the sdist, or an sdist build cannot resolve the
# patched hnsw_rs path dependency declared in vdb-core/Cargo.toml.
include = [
    "LICENSE",
    "NOTICE",
    "README.md",
    "src/**",
    { path = "vendor/**/*", format = "sdist" },
    { path = "LICENSES/*", format = "sdist" },
]

[project.optional-dependencies]
dev = [
    "maturin >=1.9.3",
    "pytest >=8.4.0",
    "psutil >=7.0.0",
]

[tool.pytest.ini_options]
# Scopes collection to the tests directory.
testpaths = ["tests"]

[project.urls]
"Repository" = "https://github.com/zeusdb/zeusdb-vector-database"
"Documentation" = "https://docs.zeusdb.com/en/latest/vector_database/"
"Bug Tracker" = "https://github.com/zeusdb/zeusdb-vector-database/issues"