# The compiler this checkout builds with.
#
# Why the file exists
#
# A toolchain named by a workflow lives outside the tree, so a local run and a
# CI run can compile on different compilers and neither says so. This file is
# in the tree, so every checkout reads the same version.
#
# The crate declares no rust-version and needs nothing newer than the pin.
#
# How to bump it
#
# When a new stable lands, raise the version here, run
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets --locked -- -D warnings
#   cargo test --workspace --locked
# from vdb-core, fix whatever the new lints find, and commit the bump with
# those fixes in the same change.
#
# What it does not do
#
# rustup's precedence is +toolchain, then RUSTUP_TOOLCHAIN, then a directory
# override, then this file. A directory override on a checkout therefore still
# wins, and has to be removed with `rustup override unset` in that directory.
[toolchain]
channel = "1.97.1"
# Declaring the components here means a bare `rustup toolchain install` in this
# directory gets a toolchain that can run the lint gate.
components = ["clippy", "rustfmt"]
profile = "minimal"
