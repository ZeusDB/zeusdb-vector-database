# The graph index's own rules, being what stands between the engine's floor
# in zeusdb-vector-core and the binding. Nothing in it names Python. The bans
# in deny.toml and the lint job in ci.yml hold it to that, and
# `cargo test -p zeusdb-vector-hnsw` compiles no Python crate.
[package]
name = "zeusdb-vector-hnsw"
# The version, the edition and the licence are the workspace's, declared once
# in the root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
# Nothing in this workspace is published to crates.io. The wheel is the only
# artefact.
publish = false

# Every version is the workspace's, declared once in the root Cargo.toml with
# the reason for each pin.
[dependencies]
zeusdb-vector-core = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The engine again, with its test data turned on, for the tests in
# src/rerank.rs that measure against it. cargo applies a dev-dependency's
# features to this crate's test targets and to nothing else, so the wheel is
# built without them.
zeusdb-vector-core = { workspace = true, features = ["test-support"] }
# For the one test that reads a calibration back from an older JSON record.
serde_json = { workspace = true }
