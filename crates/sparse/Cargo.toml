# The sparse index, being a mutable postings index over the engine's floor.
# It implements the index seam zeusdb-vector-core declares for sparse vectors
# and depends on that crate and on nothing else in the workspace. Nothing in it
# names Python. The bans in deny.toml and the lint job in ci.yml hold it to
# that, and `cargo test -p zeusdb-vector-sparse` links no Python library.
[package]
name = "zeusdb-vector-sparse"
# The version, the edition and the licence are the workspace's, declared once
# in the root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
# Nothing in this workspace is published to crates.io. The wheel is the only
# artefact.
publish = false

[features]
# The close-up made in place and the view of every part, for a test in
# another crate that holds the close-up built off to the side to them, and
# the forward arena's ceiling, for a test that lowers it to reach the
# refusal. Off in every build that is not a test, so the wheel carries none
# of them. The collection's crate turns it on through its dev-dependency on
# this crate, which cargo applies to that crate's test targets and to
# nothing else.
test-support = ["zeusdb-vector-core/test-support"]

# Every version is the workspace's, declared once in the root Cargo.toml with
# the reason for each pin.
[dependencies]
zeusdb-vector-core = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The engine again, with its test support turned on, for the view of a set's
# words the tests of the close-up read.
zeusdb-vector-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
